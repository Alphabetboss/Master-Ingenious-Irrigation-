<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ingenious Irrigation — Astra Control</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%2339ff14'/%3E%3Cstop offset='1' stop-color='%2392ff7a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 6c6 12 18 19 18 30a18 18 0 11-36 0c0-11 12-18 18-30z' fill='url(%23g)' stroke='%2319e26a' stroke-width='2'/%3E%3C/svg%3E" />
  <style>
    :root{--bg:#0b0c0c;--chrome1:#141719;--chrome2:#1c1f22;--chrome3:#2a2e33;--chrome4:#3a3f45;--neon:#39ff14;--neon-soft:#92ff7a;--blue:#00b3ff;--text:#e6f2e6;--muted:#a6b5ae;--danger:#ff5470;--ok:#19e26a;--radius:16px;--shadow:0 10px 30px rgba(0,0,0,.45)}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;color:var(--text);background:radial-gradient(1200px 800px at 20% -10%,#0e1216 0%,#070808 40%,#050606 100%);font:16px/1.5 "Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
    .bg::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent 60%),radial-gradient(1px 1px at 80% 20%,#fff,transparent 60%),radial-gradient(1px 1px at 50% 70%,#fff,transparent 60%),radial-gradient(1px 1px at 10% 80%,#fff,transparent 60%),radial-gradient(1px 1px at 70% 60%,#fff,transparent 60%);animation:drift 100s linear infinite}
    @keyframes drift{to{transform:translateY(300px)}}
    header{z-index:2;position:relative;display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(180deg,var(--chrome2),var(--chrome1));border-bottom:1px solid #1b2024;box-shadow:var(--shadow)}
    .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#0f1418,#161b1f);border:1px solid #2b3238;box-shadow:inset 0 0 0 1px #0a0c0e,0 0 12px rgba(57,255,20,.15)}
    .logo svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(57,255,20,.6))}
    .brand{display:flex;flex-direction:column}
    .brand .title{font-weight:700;letter-spacing:.2px}
    .brand .subtitle{font-size:12px;color:var(--muted)}
    .spacer{flex:1}
    .pill{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--chrome3),#1f2429);border:1px solid #2a3137;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
    .btn{cursor:pointer;padding:8px 12px;border-radius:10px;color:var(--text);background:linear-gradient(180deg,#273138,#1a2026);border:1px solid #2a3137;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);transition:transform .08s ease,box-shadow .2s ease,opacity .2s}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
    .btn--neon{background:radial-gradient(120% 120% at 20% 20%,#2a332d,#162017);border-color:#284a2e;text-shadow:0 0 8px rgba(57,255,20,.3)}
    .btn--danger{border-color:#5b2a33;background:linear-gradient(180deg,#3a1f25,#221216)}
    .hint{font-size:12px;color:var(--muted)}
    .shell{height:calc(100% - 66px);max-width:1200px;margin:0 auto;padding:16px}
    .grid{display:grid;gap:16px;height:100%;grid-template-columns:360px 1fr 420px;grid-template-areas:"left center right"}
    .panel{background:linear-gradient(180deg,var(--chrome2),var(--chrome1));border:1px solid #1b2024;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
    .panel h3{margin:12px 12px 6px 12px;font-size:14px;color:#cfe6da;letter-spacing:.3px}
    .section{padding:12px;border-top:1px solid #1b2024}
    .section:first-child{border-top:0}
    .row{display:flex;gap:10px;align-items:center}
    .field{flex:1;display:flex;flex-direction:column;gap:6px}
    .field input,.field select{width:100%;background:#12171b;color:var(--text);border:1px solid #2a3137;border-radius:10px;padding:10px}
    .pillbar{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px}
    .zone-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:linear-gradient(180deg,var(--chrome3),#1f2429);border:1px solid #2a3137;cursor:pointer}
    .zone-pill.active{outline:1px solid var(--neon);box-shadow:0 0 12px rgba(57,255,20,.25)}
    .divider{height:1px;background:#1b2024;margin:10px 0}
    .chat-header{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #1b2024;background:linear-gradient(180deg,#1a1f24,#151a1f)}
    .chat-title{font-weight:600}
    .chat-log{flex:1;overflow:auto;padding:16px;background:radial-gradient(1600px 600px at 0% 0%,rgba(57,255,20,.05),transparent 50%),radial-gradient(1200px 500px at 100% 0%,rgba(0,179,255,.06),transparent 50%),linear-gradient(180deg,var(--chrome2),var(--chrome1))}
    .msg{max-width:78%;padding:10px 12px;margin:8px 0;border-radius:14px;position:relative;border:1px solid #2a3137;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);animation:rise .15s ease}
    @keyframes rise{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
    .user{margin-left:auto;background:linear-gradient(180deg,#1f2a1f,#111611);border-color:#2b462f}
    .bot{background:linear-gradient(180deg,#252c33,#1a1f25)}
    .meta{font-size:11px;color:var(--muted);margin-bottom:6px}
    .content{white-space:pre-wrap}
    .composer{padding:12px;border-top:1px solid #1b2024;background:linear-gradient(180deg,#13181c,#0e1216);display:flex;gap:10px;align-items:flex-end}
    textarea{flex:1;min-height:52px;max-height:160px;resize:vertical;border-radius:12px;padding:12px 12px 12px 44px;color:var(--text);border:1px solid #2a3137;background:linear-gradient(180deg,#1a2026,#12171b);outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
    .textarea-icon{position:relative}
    .textarea-icon svg{position:absolute;left:12px;top:12px;width:18px;height:18px;opacity:.85;filter:drop-shadow(0 0 6px rgba(57,255,20,.35))}
    .send{min-width:120px;height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid #2b462f;color:#09110b;background:linear-gradient(180deg,#39ff14,#14e000);text-shadow:0 0 10px rgba(255,255,255,.25);box-shadow:0 6px 18px rgba(57,255,20,.25),inset 0 0 0 1px rgba(255,255,255,.25);cursor:pointer;font-weight:700;transition:transform .05s ease}
    .send:active{transform:translateY(1px)}
    .kbd{font-size:11px;border:1px solid #2a3137;background:#12171b;padding:2px 6px;border-radius:6px;color:#cfe6da}
    .card{padding:12px}
    .card h4{margin:2px 0 8px 0;font-size:13px;color:#cfe6da;letter-spacing:.3px}
    .schedule-line{font-size:14px;color:#cfe6da}
    .toast{position:fixed;left:16px;bottom:16px;padding:10px 12px;border-radius:10px;background:linear-gradient(180deg,#20262b,#151a1f);border:1px solid #2a3137;color:var(--text);box-shadow:var(--shadow);z-index:6;display:none}
    .toast.show{display:block;animation:fade .18s ease}
    .bad{color:var(--danger)}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (max-width:1200px){.grid{grid-template-columns:1fr;grid-template-areas:"center" "left" "right"}.shell{padding:12px}.panel{min-height:360px}.composer{flex-direction:column}.send{width:100%}}
  </style>
</head>
<body class="bg">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#39ff14"/><stop offset="1" stop-color="#92ff7a"/></linearGradient></defs>
        <path d="M32 6c6 12 18 19 18 30a18 18 0 11-36 0c0-11 12-18 18-30z" fill="url(#g)" stroke="#19e26a" stroke-width="2"/>
      </svg>
    </div>
    <div class="brand">
      <div class="title">Ingenious Irrigation</div>
      <div class="subtitle">Astra Control — Zones • Timers • Voice</div>
    </div>
    <div class="spacer"></div>
    <div class="pill" id="status-pill" title="AI connection status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>
  </header>

  <div class="shell">
    <div class="grid">
      <!-- LEFT: Controller -->
      <section class="panel" style="grid-area:left" aria-label="Sprinkler Controller">
        <h3>Sprinkler Controller</h3>
        <div class="pillbar" id="zone-bar" aria-label="Zones"></div>
        <div class="section">
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <button class="btn btn--neon" id="add-zone">Add Zone</button>
            <button class="btn" id="rename-zone">Rename</button>
            <button class="btn btn--danger" id="remove-zone">Remove</button>
          </div>
        </div>
        <div class="section">
          <div class="row">
            <div class="field">
              <label class="hint">Start (HH:MM)</label>
              <input type="time" id="start_time" value="05:00" />
            </div>
            <div class="field">
              <label class="hint">Duration (min)</label>
              <input type="number" id="duration_min" min="1" value="10" />
            </div>
            <div class="field">
              <label class="hint">Frequency</label>
              <select id="frequency">
                <option value="daily">Daily</option>
                <option value="every_other_day">Every other day</option>
                <option value="custom">Custom</option>
              </select>
            </div>
          </div>
          <div class="divider"></div>
          <div class="row">
            <button class="btn btn--neon" id="save-zone-schedule">Save Zone</button>
            <button class="btn" id="run-now">Run Now</button>
            <button class="btn btn--danger" id="stop-now">Stop</button>
          </div>
          <div class="hint" id="active-summary" style="margin-top:8px">Zone —</div>
        </div>
      </section>

      <!-- CENTER: Chat -->
      <section class="panel" style="grid-area:center" aria-label="Astra Chat">
        <div class="chat-header">
          <div class="chat-title">Astra — Your AI Sprinkler Tech</div>
          <div class="spacer"></div>
          <button class="btn" id="clear-chat" title="Clear messages">Clear</button>
        </div>
        <div class="chat-log" id="log" tabindex="0" aria-live="polite"></div>
        <div class="composer">
          <div class="textarea-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#39ff14" stroke-width="1.6"><path d="M12 3l1.6 3.6L17 8l-3.4 1.4L12 13l-1.6-3.6L7 8l3.4-1.4L12 3z"/></svg>
            <textarea id="msg" placeholder="Type to talk with Astra… (Shift+Enter = new line)"></textarea>
          </div>
          <button class="send" id="send" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0a1b0e" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            Send
          </button>
        </div>
      </section>

      <!-- RIGHT: Status & Tips -->
      <aside class="panel" style="grid-area:right" aria-label="Status & Tips">
        <h3>Overview</h3>
        <div class="card">
          <h4>Active Schedule</h4>
          <div class="schedule-line" id="schedule-summary">Loading…</div>
        </div>
        <div class="card">
          <h4>Quick Prompts</h4>
          <div class="hint">• "How long should I water?"<br>• "Skip if it rains."<br>• "Start zone 2 for 5 min."<br></div>
        </div>
        <div class="card">
          <h4>Audio</h4>
          <div class="hint" id="audio-hint">Voice ready.</div>
        </div>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = s => document.querySelector(s);
    const el = {
      zoneBar: $('#zone-bar'),start: $('#start_time'),dur: $('#duration_min'),freq: $('#frequency'),
      activeSummary: $('#active-summary'),scheduleSummary: $('#schedule-summary'),
      log: $('#log'),msg: $('#msg'),send: $('#send'),clearChat: $('#clear-chat'),
      saveZone: $('#save-zone-schedule'),addZone: $('#add-zone'),renameZone: $('#rename-zone'),
      removeZone: $('#remove-zone'),runNow: $('#run-now'),stopNow: $('#stop-now'),
      toast: $('#toast'),statusDot: $('#status-dot'),statusText: $('#status-text'),audioHint: $('#audio-hint')
    };

    function toast(text, bad=false){
      el.toast.innerHTML = bad ? "<span class='bad'>⚠</span> " + text : text;
      el.toast.classList.add('show');
      setTimeout(()=>el.toast.classList.remove('show'), 2600);
    }

    function setStatus(ok, text){
      el.statusDot.style.background = ok ? "var(--ok)" : "var(--danger)";
      el.statusDot.style.boxShadow = ok ? "0 0 10px var(--ok)" : "0 0 10px var(--danger)";
      el.statusText.textContent = text;
    }

    const LS_KEY = 'ii_zones_v2';
    let zones = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    if(!Array.isArray(zones) || zones.length===0){
      zones = [{id:1,name:'Zone 1 — Front Lawn',start_time:'05:00',duration_min:10,frequency:'daily'}];
      localStorage.setItem(LS_KEY, JSON.stringify(zones));
    }
    let activeZoneId = zones[0].id;

    function saveZones(){ localStorage.setItem(LS_KEY, JSON.stringify(zones)); }
    function zoneById(id){ return zones.find(z=>z.id===id); }

    function renderZoneBar(){
      el.zoneBar.innerHTML = '';
      zones.forEach(z=>{
        const b = document.createElement('button');
        b.className = 'zone-pill' + (z.id===activeZoneId ? ' active':'');
        b.textContent = z.name;
        b.addEventListener('click', ()=>{
          activeZoneId = z.id;
          loadZoneToForm();
          renderZoneBar();
        });
        el.zoneBar.appendChild(b);
      });
    }

    function loadZoneToForm(){
      const z = zoneById(activeZoneId);
      if(!z) return;
      el.start.value = z.start_time || '05:00';
      el.dur.value = z.duration_min || 10;
      el.freq.value = z.frequency || 'daily';
      el.activeSummary.textContent = `${z.name} — ${z.start_time} · ${z.duration_min} min`;
    }

    async function fetchServerSchedule(){
      try{
        const r = await fetch('/api/schedule');
        const j = await r.json();
        if(!j.zones) throw new Error('bad');
        const s = j.zones['1'] || {minutes:10};
        el.scheduleSummary.textContent = `Zone 1 · ${s.minutes} min`;
      }catch{
        el.scheduleSummary.textContent = 'Unable to load controller schedule.';
      }
    }

    function addMessage(role, text){
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const who = role === 'user' ? 'You' : 'Astra';
      const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      meta.textContent = `${who} · ${ts}`;
      const content = document.createElement('div');
      content.className = 'content';
      content.textContent = text;
      wrap.appendChild(meta);
      wrap.appendChild(content);
      el.log.appendChild(wrap);
      el.log.scrollTop = el.log.scrollHeight;
    }

    async function talkToAstra(text){
      try{
        setStatus(true, 'Thinking…');
        const r = await fetch('/astra/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
        const j = await r.json();
        if(!j.reply) throw new Error('Server rejected');
        addMessage('bot', j.reply);
        setStatus(true, 'Online');
      }catch(e){
        addMessage('bot', 'Sorry, I could not reach the server.');
        setStatus(false, 'Offline');
        toast('Network error', true);
      }
    }

    el.send.addEventListener('click', async ()=>{
      const text = el.msg.value.trim();
      if(!text) return;
      addMessage('user', text);
      el.msg.value = '';
      talkToAstra(text);
    });

    el.msg.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        el.send.click();
      }
    });

    el.saveZone.addEventListener('click', async ()=>{
      const z = zoneById(activeZoneId);
      if(!z) return toast('No active zone', true);
      const payload = {zone:Number(String(z.id).replace(/\D/g,''))||1,minutes:Number(el.dur.value)};
      try{
        const r = await fetch('/api/schedule/update', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const j = await r.json();
        if(!j.ok) throw new Error('save failed');
        el.scheduleSummary.textContent = `Zone ${j.zone} · ${j.minutes} min`;
        toast('Zone saved to controller');
      }catch{
        toast('Failed to save to controller', true);
      }
    });

    el.clearChat.addEventListener('click', ()=>{
      el.log.innerHTML = '';
      toast('Chat cleared');
    });

    el.addZone.addEventListener('click', ()=>{
      const newId = Math.max(...zones.map(z=>z.id), 0) + 1;
      zones.push({id:newId,name:`Zone ${newId}`,start_time:'05:00',duration_min:10,frequency:'daily'});
      saveZones();
      renderZoneBar();
      activeZoneId = newId;
      loadZoneToForm();
    });

    el.removeZone.addEventListener('click', ()=>{
      if(zones.length <= 1){ toast('Cannot remove last zone', true); return; }
      zones = zones.filter(z=>z.id!==activeZoneId);
      saveZones();
      activeZoneId = zones[0].id;
      renderZoneBar();
      loadZoneToForm();
    });

    el.runNow.addEventListener('click', ()=>{
      toast('Starting zone irrigation...');
    });

    el.stopNow.addEventListener('click', ()=>{
      toast('Stopping irrigation.');
    });

    setStatus(true, 'Ready');
    renderZoneBar();
    loadZoneToForm();
    fetchServerSchedule();
    addMessage('bot', 'Hi, I\'m Astra. Control your zones or ask me about your watering schedule. 🌱');
  </script>
</body>
</html>
